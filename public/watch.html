<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistir</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #0f1419; }
    .bar h1 { font-size: 16px; font-weight: 600; }
    .live { font-size: 11px; font-weight: 700; color: #fff; background: #ef4444; padding: 2px 8px; border-radius: 99px; }
    .wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 50px); }
    video { width: 100%; max-height: calc(100vh - 50px); background: #000; }
    .msg { color: #8b98a5; padding: 40px; text-align: center; }
    .msg a { color: #3b82f6; }
  </style>
</head>
<body>
  <div class="bar"><span class="live">● AO VIVO</span><h1 id="title">Canal</h1></div>
  <div class="wrap">
    <video id="v" controls autoplay playsinline></video>
  </div>
  <div class="msg hidden" id="msg"></div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const key = q.get('k');
    const name = q.get('n');
    if (name) { document.title = name; document.getElementById('title').textContent = name; }
    const video = document.getElementById('v');

    function fail(html) {
      document.querySelector('.wrap').style.display = 'none';
      const m = document.getElementById('msg');
      m.innerHTML = html; m.classList.remove('hidden');
    }

    async function start() {
      if (!key) return fail('Link inválido.');
      let cfg;
      try { cfg = await (await fetch('/api/public/config')).json(); } catch { cfg = { httpMediaPort: 8000 }; }
      const host = cfg.publicHost || location.hostname;
      const hls = `http://${host}:${cfg.httpMediaPort}/live/${key}/index.m3u8`;
      const flv = `http://${host}:${cfg.httpMediaPort}/live/${key}.flv`;

      // 1) HLS nativo (Safari/iOS) — melhor compatibilidade em TV/celular
      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = hls;
        video.play().catch(() => {});
        return;
      }
      // 2) HLS via hls.js (Chrome/Firefox/Edge)
      if (window.Hls && Hls.isSupported() && cfg.hls !== false) {
        const h = new Hls({ liveSyncDurationCount: 3, lowLatencyMode: true });
        let hlsFailed = false;
        h.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal && !hlsFailed) { hlsFailed = true; h.destroy(); playFlv(); }
        });
        h.loadSource(hls); h.attachMedia(video);
        return;
      }
      // 3) Fallback FLV (mpegts.js)
      playFlv();

      function playFlv() {
        if (window.mpegts && mpegts.isSupported()) {
          const p = mpegts.createPlayer({ type: 'flv', isLive: true, url: flv }, { enableStashBuffer: false, liveBufferLatencyChasing: true });
          p.attachMediaElement(video); p.load(); p.play().catch(() => {});
        } else {
          fail('Seu navegador não suporta a reprodução deste stream.<br>Abra no VLC: <code>' + flv + '</code>');
        }
      }
    }
    start();
  </script>
</body>
</html>
